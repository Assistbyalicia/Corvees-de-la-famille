<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Carnet de quêtes – Connexion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="shared.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6C5CE7" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <style>
    body {
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 480px;
      width: 100%;
      background: #ffffff;
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--color-border);
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 2rem;
    }
    p {
      margin: 0 0 1rem;
      font-size: 0.9rem;
      color: var(--color-text-muted);
    }
    .people-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .person-btn {
      flex: 1 1 calc(50% - 0.75rem);
      padding: 0.85rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      background: #FAF9FF;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .person-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-card);
      background: #ffffff;
    }
    .pin-form {
      margin-top: 1rem;
      display: none;
    }
    .pin-form.active {
      display: block;
    }
    .pin-form input {
      font-size: 1.2rem;
      text-align: center;
      letter-spacing: 0.3rem;
      padding: 0.5rem;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 0.5rem;
    }
    .pin-error {
      color: #c0392b;
      font-size: 0.85rem;
      margin: 0 0 0.5rem;
      display: none;
    }
    .small {
      margin-top: 1rem;
    }
    .row {
      display: flex;
      gap: 0.5rem;
    }
    .forgot-pin-form {
      margin-top: 1rem;
      display: none;
    }
    .forgot-pin-form.active {
      display: block;
    }
    .forgot-pin-form select,
    .forgot-pin-form input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.5rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🗺️ Carnet de quêtes</h1>

    <div id="offline-badge" class="offline-banner"></div>

    <div id="login-box">
      <p>Choisis qui tu es :</p>
      <div class="people-grid" id="people-grid"></div>

      <div class="pin-form" id="pin-form">
        <p class="small" id="pin-label" style="margin-top:1rem;"></p>
        <p class="pin-error" id="pin-error">Code incorrect, réessaie.</p>
        <input id="pin-input" type="password" inputmode="numeric" maxlength="8" placeholder="Code" />
        <div class="row">
          <button id="pin-submit" class="btn-primary">Valider</button>
          <button id="pin-cancel" class="btn-secondary">Annuler</button>
        </div>
      </div>

      <p class="small"><a href="#" id="forgot-pin-link">Code oublié ?</a></p>

      <div class="forgot-pin-form" id="forgot-pin-form">
        <p class="small">Choisis ton nom :</p>
        <p class="pin-error" id="forgot-pin-message"></p>
        <select id="forgot-person"></select>

        <div id="forgot-security-block">
          <p class="small" id="forgot-security-question"></p>
          <input id="forgot-security-answer" type="text" placeholder="Réponse à ta question secrète" />
        </div>

        <div id="forgot-recovery-block">
          <p class="small">
            Cette personne n'a pas encore défini de question secrète : demande
            le code de récupération familial à maman.
          </p>
          <input id="forgot-recovery-code" type="password" inputmode="numeric" placeholder="Code de récupération familial" />
        </div>

        <input id="forgot-new-pin" type="password" inputmode="numeric" placeholder="Nouveau code" />
        <input id="forgot-confirm-pin" type="password" inputmode="numeric" placeholder="Confirmer le nouveau code" />
        <div class="row">
          <button id="forgot-submit-btn" class="btn-primary">Valider</button>
          <button id="forgot-cancel-btn" class="btn-secondary">Annuler</button>
        </div>
      </div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    let data = null;
    let selectedPersonId = null;

    function goToPersonPage(personId, session) {
      if (session.isAdmin) {
        window.location.href = "adults.html";
        return;
      }
      const isChild = (data.children || []).some(c => c.id === personId);
      if (isChild) {
        data.activeChildId = personId;
        saveData(data);
        window.location.href = "kids.html";
      } else {
        data.activeAdultId = personId;
        saveData(data);
        window.location.href = "adults.html";
      }
    }

    function renderPeopleGrid() {
      const grid = document.getElementById("people-grid");
      grid.innerHTML = "";

      const allPeople = [...(data.children || []), ...(data.adults || [])];

      allPeople.forEach(person => {
        const btn = document.createElement("button");
        btn.className = "person-btn";
        btn.textContent = `${getPersonAvatar(person)} ${person.name}`;
        btn.addEventListener("click", () => {
          selectedPersonId = person.id;
          document.getElementById("pin-label").textContent = `Code de ${person.name} :`;
          document.getElementById("pin-error").style.display = "none";
          document.getElementById("pin-input").value = "";
          document.getElementById("pin-form").classList.add("active");
          document.getElementById("pin-input").focus();
        });
        grid.appendChild(btn);
      });

      if (allPeople.length === 0) {
        const span = document.createElement("span");
        span.textContent = "Aucune personne configurée.";
        grid.appendChild(span);
      }
    }

    function setupPinForm() {
      const submitBtn = document.getElementById("pin-submit");
      const cancelBtn = document.getElementById("pin-cancel");
      const input = document.getElementById("pin-input");
      const errorText = document.getElementById("pin-error");

      function attempt() {
        if (!selectedPersonId) return;
        const allPeople = [...(data.children || []), ...(data.adults || [])];
        if (checkPin(selectedPersonId, input.value.trim(), allPeople)) {
          const session = setSession(selectedPersonId, allPeople);
          goToPersonPage(selectedPersonId, session);
        } else {
          errorText.style.display = "block";
          input.value = "";
          input.focus();
        }
      }

      submitBtn.addEventListener("click", attempt);
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") attempt();
      });
      cancelBtn.addEventListener("click", () => {
        selectedPersonId = null;
        document.getElementById("pin-form").classList.remove("active");
      });
    }

    function renderForgotPersonSelect() {
      const select = document.getElementById("forgot-person");
      if (!select) return;
      select.innerHTML = "";
      const allPeople = [...(data.children || []), ...(data.adults || [])];
      allPeople.forEach(person => {
        const option = document.createElement("option");
        option.value = person.id;
        option.textContent = person.name;
        select.appendChild(option);
      });
    }

    // Bascule entre "répondre à sa question secrète" et "code de récupération
    // familial", selon si la personne choisie a défini une question ou non.
    function updateForgotBlocks() {
      const allPeople = [...(data.children || []), ...(data.adults || [])];
      const personId = document.getElementById("forgot-person").value;
      const person = allPeople.find(p => p.id === personId);

      const securityBlock = document.getElementById("forgot-security-block");
      const recoveryBlock = document.getElementById("forgot-recovery-block");
      const questionText = document.getElementById("forgot-security-question");

      if (person && person.question) {
        questionText.textContent = person.question;
        securityBlock.style.display = "block";
        recoveryBlock.style.display = "none";
      } else {
        securityBlock.style.display = "none";
        recoveryBlock.style.display = "block";
      }
    }

    function setupForgotPinForm() {
      const link = document.getElementById("forgot-pin-link");
      const form = document.getElementById("forgot-pin-form");
      const cancelBtn = document.getElementById("forgot-cancel-btn");
      const submitBtn = document.getElementById("forgot-submit-btn");
      const message = document.getElementById("forgot-pin-message");
      const personSelect = document.getElementById("forgot-person");

      if (!link || !form || !cancelBtn || !submitBtn || !message || !personSelect) return;

      personSelect.addEventListener("change", updateForgotBlocks);

      link.addEventListener("click", e => {
        e.preventDefault();
        document.getElementById("pin-form").classList.remove("active");
        message.style.display = "none";
        form.classList.add("active");
        updateForgotBlocks();
      });

      cancelBtn.addEventListener("click", () => {
        form.classList.remove("active");
      });

      submitBtn.addEventListener("click", async () => {
        message.style.display = "none";

        const allPeople = [...(data.children || []), ...(data.adults || [])];
        const personId = document.getElementById("forgot-person").value;
        const person = allPeople.find(p => p.id === personId);
        const newPin = document.getElementById("forgot-new-pin").value.trim();
        const confirmPin = document.getElementById("forgot-confirm-pin").value.trim();

        if (person && person.question) {
          const answer = document.getElementById("forgot-security-answer").value;
          if (!checkSecurityAnswer(personId, answer, allPeople)) {
            message.textContent = "Réponse incorrecte.";
            message.style.display = "block";
            return;
          }
        } else {
          const recoveryCode = document.getElementById("forgot-recovery-code").value.trim();
          if (recoveryCode !== FAMILY_RECOVERY_CODE) {
            message.textContent = "Code de récupération incorrect.";
            message.style.display = "block";
            return;
          }
        }
        if (!newPin) {
          message.textContent = "Merci de saisir un nouveau code.";
          message.style.display = "block";
          return;
        }
        if (newPin !== confirmPin) {
          message.textContent = "Les deux codes ne correspondent pas.";
          message.style.display = "block";
          return;
        }

        await postUpdatePin(personId, newPin);

        message.style.color = "#28a745";
        message.textContent = "Code mis à jour ! Tu peux te connecter avec ton nouveau code.";
        message.style.display = "block";
        document.getElementById("forgot-security-answer").value = "";
        document.getElementById("forgot-recovery-code").value = "";
        document.getElementById("forgot-new-pin").value = "";
        document.getElementById("forgot-confirm-pin").value = "";
      });
    }

    async function initApp() {
      data = await loadAppData();

      // Déjà connecté(e) : file directement vers sa page, sans repasser par
      // l'écran de connexion (le bouton "Se déconnecter" de kids.html/adults.html
      // reste le seul moyen de revenir ici volontairement).
      const session = getSession();
      if (session) {
        goToPersonPage(session.personId, session);
        return;
      }

      renderOfflineBadge(data);
      renderPeopleGrid();
      setupPinForm();
      renderForgotPersonSelect();
      setupForgotPinForm();
      updateForgotBlocks();
    }

    initApp();
  </script>
</body>
</html>
